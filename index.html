<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Moon Pong Game</title>
  <meta name="theme-color" content="#0a1428">
  
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      background: #0f2844; 
      color: white; 
      font-family: 'Arial', sans-serif; 
      overflow: hidden; 
      height: 100vh; 
    }
    #starfield { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; 
    }
    .star { 
      position: absolute; background: white; border-radius: 50%; opacity: 0.8; 
      animation: twinkle 4s infinite; 
    }
    .small { width: 2px; height: 2px; }
    .medium { width: 3px; height: 3px; }
    .large { width: 4px; height: 4px; }
    @keyframes twinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

    .page { 
      display: none; 
      width: 100%; 
      height: 100vh; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
    }
    .page.active { display: flex; }

    /* Start Page */
    .start-container { text-align: center; }
    .moon-big { font-size: 100px; margin-bottom: 20px; }
    h1 { font-size: 48px; margin: 10px 0; text-shadow: 0 0 20px #00d4ff; }
    .by-line { font-size: 18px; margin-bottom: 40px; opacity: 0.8; }
    .instructions { 
      background: rgba(0, 212, 255, 0.1); 
      border: 2px solid #00d4ff; 
      border-radius: 20px; 
      padding: 20px; 
      max-width: 300px; 
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); 
      margin-bottom: 40px; 
    }
    .btn-start { 
      background: #00d4ff; 
      color: black; 
      border: none; 
      padding: 15px 40px; 
      font-size: 24px; 
      border-radius: 50px; 
      cursor: pointer; 
      box-shadow: 0 0 30px #00d4ff; 
    }

    /* Game Page */
    .game-header { 
      width: 100%; 
      padding: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 20px; 
      background: rgba(0,0,0,0.3); 
    }
    .game-container { 
      flex: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
    }
    canvas { display: block; background: #0f2844; }

    /* Modals */
    .modal { 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.8); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .modal.hidden { display: none; }
    .modal-content { 
      text-align: center; 
      background: #1a2b44; 
      padding: 30px; 
      border-radius: 20px; 
      border: 2px solid #00d4ff; 
      box-shadow: 0 0 30px rgba(0,212,255,0.5); 
      max-width: 90%; 
    }
    .modal-emoji { font-size: 80px; margin-bottom: 20px; }
    .modal-buttons { margin-top: 30px; }
    .btn-modal { 
      padding: 10px 20px; 
      margin: 10px; 
      border: none; 
      border-radius: 10px; 
      font-size: 18px; 
      cursor: pointer; 
    }
    .btn-success { background: #00ff00; color: black; }
    .btn-primary { background: #00d4ff; color: black; }
    .btn-secondary { background: #666; color: white; }
  </style>
</head>
<body>
  <div id="starfield"></div>

  <!-- Your HTML structure (unchanged) -->
  <div id="start-page" class="page active">
    <div class="start-container">
      <div class="moon-big">🌙</div>
      <h1>MOON PONG</h1>
      <p class="by-line">by Francis Mburu</p>
      <div class="instructions">
        <p>🎮 Control the left paddle with: </p>
        <p>• Mouse movement</p>
        <p>• Arrow Keys (↑ ↓)</p>
        <p style="margin-top: 20px;">⭐ Win 5 points to defeat the AI</p>
        <p>📈 Each level gets harder!</p>
      </div>
      <button id="start-btn" class="btn-start">START GAME</button>
    </div>
  </div>

  <div id="game-page" class="page">
    <div class="game-header">
      <div class="level-info">Level <span id="level-num">1</span></div>
      <div class="score-display">
        <span id="player-score">0</span> : <span id="ai-score">0</span>
      </div>
      <div class="level-info">First to 5!</div>
    </div>
    <div class="game-container">
      <canvas id="pong"></canvas>
    </div>
  </div>

  <div id="win-modal" class="modal hidden">
    <div class="modal-content win-content">
      <div class="modal-emoji">🎉</div>
      <h2>YOU WIN!</h2>
      <p id="win-text">Great job! You won Level 1!</p>
      <div class="modal-buttons">
        <button id="next-btn" class="btn-modal btn-success">NEXT LEVEL</button>
        <button id="menu-btn-win" class="btn-modal btn-secondary">MAIN MENU</button>
      </div>
    </div>
  </div>

  <div id="lose-modal" class="modal hidden">
    <div class="modal-content lose-content">
      <div class="modal-emoji">😢</div>
      <h2>GAME OVER!</h2>
      <p id="lose-text">AI won. Try again!</p>
      <div class="modal-buttons">
        <button id="retry-btn" class="btn-modal btn-primary">RETRY LEVEL</button>
        <button id="menu-btn-lose" class="btn-modal btn-secondary">MAIN MENU</button>
      </div>
    </div>
  </div>

  <script>
    // ===== FULL FIXED JAVASCRIPT (all improvements included) =====
    let gameState = 'start';
    let currentLevel = 1;
    let playerScore = 0;
    let aiScore = 0;
    const POINTS_TO_WIN = 5;

    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');

    let width, height;
    let paddleWidth, paddleHeight, playerY, aiY, mouseY, paddleSpeed;
    let ballX, ballY, ballRadius;
    let ballSpeed = 4;
    let ballVelX = 0, ballVelY = 0;

    let upPressed = false, downPressed = false;

    function resizeCanvas() {
      const marginX = 20;
      const marginY = 100;

      let targetWidth = window.innerWidth - marginX;
      let targetHeight = window.innerHeight - marginY;

      const aspect = 800 / 500;

      if (targetWidth / targetHeight > aspect) {
        targetWidth = targetHeight * aspect;
      } else {
        targetHeight = targetWidth / aspect;
      }

      targetWidth = Math.floor(targetWidth);
      targetHeight = Math.floor(targetHeight);

      const isFirst = width === undefined;

      let oldWidth = width || 800;
      let oldHeight = height || 500;

      canvas.width = targetWidth;
      canvas.height = targetHeight;
      canvas.style.width = targetWidth + 'px';
      canvas.style.height = targetHeight + 'px';

      if (!isFirst) {
        const scale = targetHeight / oldHeight; // same for X/Y due to aspect lock
        playerY *= scale;
        aiY *= scale;
        mouseY *= scale;
        ballX *= scale;
        ballY *= scale;
        ballVelX *= scale;
        ballVelY *= scale;
      }

      width = targetWidth;
      height = targetHeight;

      paddleWidth = width * (15 / 800);
      paddleHeight = height * (90 / 500);
      ballRadius = height * (7 / 500);
      paddleSpeed = height * (6 / 500) * 1.5; // slightly faster for mobile feel

      if (isFirst) {
        playerY = height / 2 - paddleHeight / 2;
        aiY = playerY;
        mouseY = playerY;
        ballX = width / 2;
        ballY = height / 2;
      }

      playerY = Math.max(0, Math.min(height - paddleHeight, playerY));
      aiY = Math.max(0, Math.min(height - paddleHeight, aiY));
      mouseY = Math.max(0, Math.min(height - paddleHeight, mouseY));
    }

    function createStars() {
      const starfield = document.getElementById('starfield');
      starfield.innerHTML = '';
      for (let i = 0; i < 200; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random();
        if (size < 0.5) star.classList.add('small');
        else if (size < 0.8) star.classList.add('medium');
        else star.classList.add('large');
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        starfield.appendChild(star);
      }
    }

    // Page & Modal functions (unchanged)
    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageName).classList.add('active');
    }
    function showModal(name) { document.getElementById(name).classList.remove('hidden'); }
    function hideAllModals() {
      document.getElementById('win-modal').classList.add('hidden');
      document.getElementById('lose-modal').classList.add('hidden');
    }

    // Buttons
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('next-btn').addEventListener('click', nextLevel);
    document.getElementById('retry-btn').addEventListener('click', retryLevel);
    document.getElementById('menu-btn-win').addEventListener('click', backToMenu);
    document.getElementById('menu-btn-lose').addEventListener('click', backToMenu);

    function startGame() {
      ballSpeed = 4 + (currentLevel - 1) * 0.7;
      resetGameState();
      showPage('game-page');
      hideAllModals();
      document.getElementById('level-num').textContent = currentLevel;
      gameState = 'playing';
      gameLoop();
    }

    function nextLevel() { currentLevel++; startGame(); }
    function retryLevel() { startGame(); }
    function backToMenu() {
      currentLevel = 1;
      gameState = 'start';
      showPage('start-page');
      hideAllModals();
    }

    function resetGameState() {
      playerScore = 0;
      aiScore = 0;
      document.getElementById('player-score').textContent = 0;
      document.getElementById('ai-score').textContent = 0;
      playerY = height / 2 - paddleHeight / 2;
      aiY = playerY;
      mouseY = playerY;
      resetBall();
    }

    function resetBall() {
      ballX = width / 2;
      ballY = height / 2;
      ballVelX = ballSpeed * (Math.random() > 0.5 ? 1 : -1);
      ballVelY = ballSpeed * (Math.random() > 0.5 ? 1 : -1);
    }

    function draw() {
      ctx.fillStyle = 'rgba(15, 40, 68, 0.2)';
      ctx.fillRect(0, 0, width, height);

      // Player paddle
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(20, playerY, paddleWidth, paddleHeight);
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, playerY, paddleWidth, paddleHeight);

      // AI paddle
      ctx.fillStyle = '#00d4ff';
      ctx.fillRect(width - paddleWidth - 20, aiY, paddleWidth, paddleHeight);
      ctx.strokeStyle = '#0099cc';
      ctx.lineWidth = 2;
      ctx.strokeRect(width - paddleWidth - 20, aiY, paddleWidth, paddleHeight);

      // Ball
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Center line
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.2)';
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function update() {
      if (gameState !== 'playing') return;

      // Instant paddle follow + keyboard
      playerY = mouseY;
      if (upPressed) playerY -= paddleSpeed;
      if (downPressed) playerY += paddleSpeed;
      playerY = Math.max(0, Math.min(height - paddleHeight, playerY));

      // AI
      const aiCenter = aiY + paddleHeight / 2;
      const aiDifficulty = 3.5 + currentLevel * 0.4;
      if (aiCenter < ballY - 20) aiY += aiDifficulty;
      if (aiCenter > ballY + 20) aiY -= aiDifficulty;
      aiY = Math.max(0, Math.min(height - paddleHeight, aiY));

      // Ball move
      ballX += ballVelX;
      ballY += ballVelY;

      // Walls
      if (ballY - ballRadius < 0 || ballY + ballRadius > height) {
        ballVelY = -ballVelY;
      }

      // Paddle collisions (dynamic width)
      if (ballX - ballRadius < 20 + paddleWidth && ballX > 20 && ballY > playerY && ballY < playerY + paddleHeight) {
        ballX = 20 + paddleWidth + ballRadius;
        ballVelX = Math.abs(ballVelX) * 1.05;
        ballVelY += (ballY - (playerY + paddleHeight / 2)) * 0.15;
      }
      if (ballX + ballRadius > width - 20 - paddleWidth && ballX < width - 20 && ballY > aiY && ballY < aiY + paddleHeight) {
        ballX = width - 20 - paddleWidth - ballRadius;
        ballVelX = -Math.abs(ballVelX) * 1.05;
        ballVelY += (ballY - (aiY + paddleHeight / 2)) * 0.15;
      }

      // Scoring
      if (ballX > width) { playerScore++; resetBall(); checkWinCondition(); }
      if (ballX < 0) { aiScore++; resetBall(); checkWinCondition(); }

      document.getElementById('player-score').textContent = playerScore;
      document.getElementById('ai-score').textContent = aiScore;
    }

    function checkWinCondition() {
      if (playerScore >= POINTS_TO_WIN) {
        gameState = 'won';
        document.getElementById('win-text').textContent = `Great job! You won Level ${currentLevel}!`;
        showModal('win-modal');
      } else if (aiScore >= POINTS_TO_WIN) {
        gameState = 'lost';
        document.getElementById('lose-text').textContent = `AI won ${aiScore}-${playerScore}. Try again!`;
        showModal('lose-modal');
      }
    }

    function gameLoop() {
      update();
      draw();
      if (gameState === 'playing') requestAnimationFrame(gameLoop);
    }

    // Controls
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseY = e.clientY - rect.top - paddleHeight / 2;
      mouseY = Math.max(0, Math.min(height - paddleHeight, mouseY));
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      mouseY = e.touches[0].clientY - rect.top - paddleHeight / 2;
      mouseY = Math.max(0, Math.min(height - paddleHeight, mouseY));
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') upPressed = true;
      if (e.key === 'ArrowDown') downPressed = true;
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp') upPressed = false;
      if (e.key === 'ArrowDown') downPressed = false;
    });

    // Init
    createStars();
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);

    console.log('Moon Pong loaded – ready!');
  </script>
</body>
  </html>
