<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Moon Pong Game</title>
 <meta name="theme-color" content="#0a1428">
 
 <style>
 * { box-sizing: border-box; }
 body { 
 margin: 0; 
 padding: 0; 
 background: #0f2844; 
 color: white; 
 font-family: 'Arial', sans-serif; 
 overflow: hidden; 
 height: 100vh; 
 }
 #starfield { 
 position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; 
 }
 .star { 
 position: absolute; background: white; border-radius: 50%; opacity: 0.8; 
 animation: twinkle 4s infinite; 
 }
 .small { width: 2px; height: 2px; }
 .medium { width: 3px; height: 3px; }
 .large { width: 4px; height: 4px; }
 @keyframes twinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

 .page { 
 display: none; 
 width: 100%; 
 height: 100vh; 
 flex-direction: column; 
 align-items: center; 
 justify-content: center; 
 }
 .page.active { display: flex; }

 /* Start Page */
 .start-container { text-align: center; }
 .moon-big { font-size: 100px; margin-bottom: 20px; }
 h1 { font-size: 48px; margin: 10px 0; text-shadow: 0 0 20px #00d4ff; }
 .by-line { font-size: 18px; margin-bottom: 40px; opacity: 0.8; }
 .instructions { 
 background: rgba(0, 212, 255, 0.1); 
 border: 2px solid #00d4ff; 
 border-radius: 20px; 
 padding: 20px; 
 max-width: 300px; 
 box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); 
 margin-bottom: 40px; 
 }
 .btn-start { 
 background: #00d4ff; 
 color: black; 
 border: none; 
 padding: 15px 40px; 
 font-size: 24px; 
 border-radius: 50px; 
 cursor: pointer; 
 box-shadow: 0 0 30px #00d4ff; 
 }

 /* Game Page */
 .game-header { 
 width: 100%; 
 padding: 10px; 
 display: flex; 
 justify-content: space-between; 
 align-items: center; 
 font-size: 20px; 
 background: rgba(0,0,0,0.3); 
 }
 .game-container { 
 flex: 1; 
 display: flex; 
 align-items: center; 
 justify-content: center; 
 width: 100%; 
 }
 canvas { display: block; background: #0f2844; }

 /* Modals */
 .modal { 
 position: fixed; 
 top: 0; left: 0; width: 100%; height: 100%; 
 background: rgba(0,0,0,0.8); 
 display: flex; 
 align-items: center; 
 justify-content: center; 
 }
 .modal.hidden { display: none; }
 .modal-content { 
 text-align: center; 
 background: #1a2b44; 
 padding: 30px; 
 border-radius: 20px; 
 border: 2px solid #00d4ff; 
 box-shadow: 0 0 30px rgba(0,212,255,0.5); 
 max-width: 90%; 
 }
 .modal-emoji { font-size: 80px; margin-bottom: 20px; }
 .modal-buttons { margin-top: 30px; }
 .btn-modal { 
 padding: 10px 20px; 
 margin: 10px; 
 border: none; 
 border-radius: 10px; 
 font-size: 18px; 
 cursor: pointer; 
 }
 .btn-success { background: #00ff00; color: black; }
 .btn-primary { background: #00d4ff; color: black; }
 .btn-secondary { background: #666; color: white; }
 </style>
</head>
<body>
 <div id="starfield"></div>

 <!-- Background Music -->
 <audio id="bg-music" loop preload="auto">
 <source src="https://opengameart.org/sites/default/files/ville_seppanen-1_g.mp3" type="audio/mpeg">
 </audio>

 <!-- Sound Effects -->
 <audio id="sfx-paddle-hit" preload="auto">
 <source src="https://freesound.org/data/previews/270/270342_3512673-lq.mp3" type="audio/mpeg">
 </audio>
 <audio id="sfx-wall-bounce" preload="auto">
 <source src="https://freesound.org/data/previews/270/270338_3512673-lq.mp3" type="audio/mpeg">
 </audio>
 <audio id="sfx-score" preload="auto">
 <source src="https://freesound.org/data/previews/270/270341_3512673-lq.mp3" type="audio/mpeg">
 </audio>
 <audio id="sfx-win" preload="auto">
 <source src="https://freesound.org/data/previews/270/270333_3512673-lq.mp3" type="audio/mpeg">
 </audio>
 <audio id="sfx-lose" preload="auto">
 <source src="https://freesound.org/data/previews/270/270334_3512673-lq.mp3" type="audio/mpeg">
 </audio>

 <div id="start-page" class="page active">
 <div class="start-container">
 <div class="moon-big">🌙</div>
 <h1>MOON PONG</h1>
 <p class="by-line">by Francis Mburu</p>
 <div class="instructions">
 <p>🎮 Control the left paddle with: </p>
 <p>• Mouse movement</p>
 <p>• Arrow Keys (↑ ↓)</p>
 <p style="margin-top: 20px;">⭐ Win 5 points to defeat the AI</p>
 <p>📈 Each level gets harder!</p>
 </div>
 <button id="start-btn" class="btn-start">START GAME</button>
 </div>
 </div>

 <div id="game-page" class="page">
 <div class="game-header">
 <div class="level-info">Level <span id="level-num">1</span></div>
 <div class="score-display">
 <span id="player-score">0</span> : <span id="ai-score">0</span>
 </div>
 <div class="level-info">First to 5!</div>
 </div>
 <div class="game-container">
 <canvas id="pong"></canvas>
 </div>
 </div>

 <div id="win-modal" class="modal hidden">
 <div class="modal-content win-content">
 <div class="modal-emoji">🎉</div>
 <h2>YOU WIN!</h2>
 <p id="win-text">Great job! You won Level 1!</p>
 <div class="modal-buttons">
 <button id="next-btn" class="btn-modal btn-success">NEXT LEVEL</button>
 <button id="menu-btn-win" class="btn-modal btn-secondary">MAIN MENU</button>
 </div>
 </div>
 </div>

 <div id="lose-modal" class="modal hidden">
 <div class="modal-content lose-content">
 <div class="modal-emoji">😢</div>
 <h2>GAME OVER!</h2>
 <p id="lose-text">AI won. Try again!</p>
 <div class="modal-buttons">
 <button id="retry-btn" class="btn-modal btn-primary">RETRY LEVEL</button>
 <button id="menu-btn-lose" class="btn-modal btn-secondary">MAIN MENU</button>
 </div>
 </div>
 </div>

 bgMusic.pause();
